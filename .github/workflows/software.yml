name: software validation
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r software_v3/requirements.txt
      - run: python -m pytest software_v3/tests pickup_v2/pi/tests -q
      - run: python -m software_v3.demo
      - uses: actions/upload-artifact@v4
        with:
          name: software-only-demo
          path: software_v3/artifacts/
